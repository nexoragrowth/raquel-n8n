<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1502" width="1200" height="1502" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Asiri para la secretaria: cuando escribe un paciente, Asiri espera, no se mete si la secretaria escribió en la última hora, y si no contesta o avisa; qué hace sola, qué le pasa a la secretaria y qué hace ella."><rect x="0" y="0" width="1200" height="1502" fill="#ffffff"/><text x="40" y="70" font-size="40" font-weight="700" fill="#16211b" text-anchor="start">Asiri: lo que tenés que saber</text><text x="40" y="116" font-size="22" font-weight="400" fill="#3d4b44" text-anchor="start">Asiri es la secretaria virtual del WhatsApp de la clínica.</text><text x="40" y="146" font-size="22" font-weight="400" fill="#3d4b44" text-anchor="start">Contesta sola lo fácil y te avisa a vos lo demás.</text><text x="40" y="202" font-size="28" font-weight="700" fill="#16211b" text-anchor="start">Cuando escribe un paciente</text><rect x="40" y="224" width="1120" height="66" rx="14" fill="#f4f6f5" stroke="#b5c2bb" stroke-width="2"/><circle cx="86" cy="257" r="22" fill="#5b6b63"/><text x="86" y="265" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="126" y="266" font-size="24" font-weight="700" fill="#16211b" text-anchor="start">Llega un WhatsApp de un paciente</text><path d="M86,294 L86,308" stroke="#3c4a43" stroke-width="3"/><path d="M78,304 L86,314 L94,304 z" fill="#3c4a43"/><rect x="40" y="318" width="1120" height="66" rx="14" fill="#f4f6f5" stroke="#b5c2bb" stroke-width="2"/><circle cx="86" cy="351" r="22" fill="#5b6b63"/><text x="86" y="359" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="126" y="360" font-size="24" font-weight="700" fill="#16211b" text-anchor="start">Asiri espera unos segundos a que termine de escribir</text><path d="M86,388 L86,402" stroke="#3c4a43" stroke-width="3"/><path d="M78,398 L86,408 L94,398 z" fill="#3c4a43"/><rect x="40" y="412" width="1120" height="92" rx="14" fill="#fdecec" stroke="#d98c8c" stroke-width="2"/><circle cx="86" cy="445" r="22" fill="#c24141"/><text x="86" y="453" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="126" y="454" font-size="24" font-weight="700" fill="#16211b" text-anchor="start">¿Vos le escribiste en la última hora?</text><text x="126" y="486" font-size="22" font-weight="400" fill="#a61b1b" text-anchor="start">Sí → Asiri no se mete. Esa charla es tuya.</text><path d="M86,508 L86,522" stroke="#3c4a43" stroke-width="3"/><path d="M78,518 L86,528 L94,518 z" fill="#3c4a43"/><rect x="40" y="532" width="1120" height="92" rx="14" fill="#e3f1e8" stroke="#16a34a" stroke-width="2"/><circle cx="86" cy="565" r="22" fill="#16a34a"/><text x="86" y="573" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><text x="126" y="574" font-size="24" font-weight="700" fill="#16211b" text-anchor="start">Si no: Asiri contesta lo que sabe</text><text x="126" y="606" font-size="22" font-weight="400" fill="#15803d" text-anchor="start">o te avisa en el grupo de la clínica.</text><rect x="40" y="670" width="550" height="336" rx="16" fill="#f2faf5" stroke="#16a34a" stroke-width="2.5"/><rect x="610" y="670" width="550" height="336" rx="16" fill="#fff7ed" stroke="#c2410c" stroke-width="2.5"/><text x="64" y="718" font-size="28" font-weight="700" fill="#15803d" text-anchor="start">Asiri lo hace sola</text><text x="634" y="718" font-size="28" font-weight="700" fill="#c2410c" text-anchor="start">Te lo pasa a vos</text><text x="64" y="762" font-size="22" font-weight="400" fill="#16211b" text-anchor="start">•  Dar turnos</text><text x="64" y="798" font-size="22" font-weight="400" fill="#16211b" text-anchor="start">•  Confirmar turnos cuando</text><text x="86" y="834" font-size="22" font-weight="400" fill="#3d4b44" text-anchor="start">contestan el recordatorio</text><text x="64" y="870" font-size="22" font-weight="400" fill="#16211b" text-anchor="start">•  Recibir comprobantes</text><text x="64" y="906" font-size="22" font-weight="400" fill="#16211b" text-anchor="start">•  Pasar el alias</text><text x="64" y="942" font-size="22" font-weight="400" fill="#16211b" text-anchor="start">•  Decir el precio de la consulta,</text><text x="86" y="978" font-size="22" font-weight="400" fill="#3d4b44" text-anchor="start">los horarios y la dirección</text><text x="634" y="762" font-size="22" font-weight="400" fill="#16211b" text-anchor="start">•  Dolor o aparato roto</text><text x="656" y="798" font-size="22" font-weight="400" fill="#3d4b44" text-anchor="start">(también le avisa a la Dra.)</text><text x="634" y="834" font-size="22" font-weight="400" fill="#16211b" text-anchor="start">•  Precios de tratamientos y cuotas</text><text x="634" y="870" font-size="22" font-weight="400" fill="#16211b" text-anchor="start">•  Cambiar un turno que es</text><text x="656" y="906" font-size="22" font-weight="400" fill="#3d4b44" text-anchor="start">en menos de 2 días</text><text x="634" y="942" font-size="22" font-weight="400" fill="#16211b" text-anchor="start">•  Preguntas de salud</text><text x="634" y="978" font-size="22" font-weight="400" fill="#16211b" text-anchor="start">•  Quejas y cosas raras</text><rect x="40" y="1052" width="1120" height="360" rx="16" fill="#eef3fb" stroke="#1d4ed8" stroke-width="2.5"/><text x="64" y="1100" font-size="28" font-weight="700" fill="#1d4ed8" text-anchor="start">Lo que hacés vos</text><circle cx="82" cy="1138" r="17" fill="#1d4ed8"/><text x="82" y="1145" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="112" y="1146" font-size="22" font-weight="400" fill="#16211b" text-anchor="start">Mirá el grupo de la clínica: cuando Asiri avisa,</text><text x="112" y="1176" font-size="22" font-weight="400" fill="#3d4b44" text-anchor="start">contestale vos al paciente.</text><circle cx="82" cy="1212" r="17" fill="#1d4ed8"/><text x="82" y="1219" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="112" y="1220" font-size="22" font-weight="400" fill="#16211b" text-anchor="start">Cuando le escribís a un paciente,</text><text x="112" y="1250" font-size="22" font-weight="400" fill="#3d4b44" text-anchor="start">Asiri se calla 1 hora en ese chat.</text><circle cx="82" cy="1286" r="17" fill="#1d4ed8"/><text x="82" y="1293" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="112" y="1294" font-size="22" font-weight="400" fill="#16211b" text-anchor="start">Comprobantes: fijate que la plata</text><text x="112" y="1324" font-size="22" font-weight="400" fill="#3d4b44" text-anchor="start">haya entrado de verdad.</text><circle cx="82" cy="1360" r="17" fill="#1d4ed8"/><text x="82" y="1367" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><text x="112" y="1368" font-size="22" font-weight="400" fill="#16211b" text-anchor="start">Si Asiri se equivocó: escribile vos al paciente</text><text x="112" y="1398" font-size="22" font-weight="400" fill="#3d4b44" text-anchor="start">y mandale una captura a Lucas.</text><text x="40" y="1462" font-size="24" font-weight="700" fill="#16211b" text-anchor="start">¿Dudas? Preguntale a Lucas.</text></svg>