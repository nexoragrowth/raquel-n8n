<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1190" width="1600" height="1190" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Cómo funciona Asiri: el mensaje del paciente pasa por la entrada, el control de modo humano, el triaje de urgencias y el orquestador, que reparte entre Turnos, Pagos, Información y Urgencias; abajo, qué hace Asiri, qué no hace y qué hace la secretaria.">
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3c4a43"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1600" height="1190" fill="#ffffff"/>

  <!-- Título -->
  <text x="40" y="54" font-size="30" font-weight="700" fill="#16211b">Asiri · la secretaria virtual de la clínica</text>
  <text x="40" y="84" font-size="16" fill="#4b5a52">Cómo viaja un mensaje de WhatsApp y qué hace cada parte · Dra. Raquel Rodríguez · Áurea Odontología Estética</text>

  <!-- FILA 1: el camino del mensaje -->
  <g font-size="14" fill="#16211b">
    <rect x="40" y="120" width="190" height="150" rx="12" fill="#eef4f0" stroke="#9fb8aa" stroke-width="1.5"/>
    <text x="58" y="150" font-size="17" font-weight="700">Paciente</text>
    <text x="58" y="178">Escribe, manda un</text>
    <text x="58" y="198">audio, una foto o</text>
    <text x="58" y="218">un comprobante</text>
    <text x="58" y="238">por WhatsApp.</text>

    <rect x="270" y="120" width="260" height="150" rx="12" fill="#eef4f0" stroke="#9fb8aa" stroke-width="1.5"/>
    <text x="288" y="150" font-size="17" font-weight="700">1. Entrada</text>
    <text x="288" y="178">Junta los mensajes seguidos (22 s)</text>
    <text x="288" y="198">Audio → lo pasa a texto</text>
    <text x="288" y="218">Foto → la describe (¿comprobante?)</text>
    <text x="288" y="238">Descarta duplicados y reacciones</text>

    <rect x="570" y="120" width="230" height="150" rx="12" fill="#fdf2f2" stroke="#d9a3a3" stroke-width="1.5"/>
    <text x="588" y="150" font-size="17" font-weight="700">2. ¿La secretaria</text>
    <text x="588" y="171" font-size="17" font-weight="700">escribió hace &lt; 1 h?</text>
    <text x="588" y="200" fill="#a61b1b" font-weight="700">Sí → Asiri se calla</text>
    <text x="588" y="220">(modo humano: la charla</text>
    <text x="588" y="240">es de la secretaria)</text>

    <rect x="840" y="120" width="230" height="150" rx="12" fill="#fdf2f2" stroke="#d9a3a3" stroke-width="1.5"/>
    <text x="858" y="150" font-size="17" font-weight="700">3. ¿Es urgencia?</text>
    <text x="858" y="178">Dolor, bracket suelto,</text>
    <text x="858" y="198">aparato que lastima</text>
    <text x="858" y="220" fill="#a61b1b" font-weight="700">Sí → triaje: video de</text>
    <text x="858" y="240" fill="#a61b1b" font-weight="700">ayuda + aviso a la Dra.</text>

    <rect x="1110" y="120" width="450" height="150" rx="12" fill="#e3f1e8" stroke="#16a34a" stroke-width="2.5"/>
    <text x="1128" y="150" font-size="17" font-weight="700">4. Orquestador (la recepcionista)</text>
    <text x="1128" y="178">Entiende qué quiere el paciente y reparte cada</text>
    <text x="1128" y="198">pedido al agente que corresponde.</text>
    <text x="1128" y="220" font-weight="700" fill="#15803d">Si en un mismo mensaje pide varias cosas</text>
    <text x="1128" y="240" font-weight="700" fill="#15803d">(turno + alias), las reparte todas.</text>
  </g>
  <g stroke="#3c4a43" stroke-width="2" fill="none" marker-end="url(#flecha)">
    <line x1="230" y1="195" x2="266" y2="195"/>
    <line x1="530" y1="195" x2="566" y2="195"/>
    <line x1="800" y1="195" x2="836" y2="195"/>
    <line x1="1070" y1="195" x2="1106" y2="195"/>
  </g>
  <g font-size="12" fill="#4b5a52">
    <text x="806" y="186">no</text>
    <text x="1076" y="186">no</text>
  </g>

  <!-- Reparto del orquestador -->
  <g stroke="#3c4a43" stroke-width="2" fill="none">
    <line x1="1335" y1="270" x2="1335" y2="310"/>
    <line x1="220" y1="310" x2="1420" y2="310"/>
  </g>
  <g stroke="#3c4a43" stroke-width="2" fill="none" marker-end="url(#flecha)">
    <line x1="220" y1="310" x2="220" y2="336"/>
    <line x1="570" y1="310" x2="570" y2="336"/>
    <line x1="850" y1="310" x2="850" y2="336"/>
    <line x1="1130" y1="310" x2="1130" y2="336"/>
    <line x1="1420" y1="310" x2="1420" y2="336"/>
  </g>
  <text x="1345" y="300" font-size="12" fill="#4b5a52">reparte</text>

  <!-- FILA 2: respuestas fijas y los 4 agentes -->
  <g font-size="14" fill="#16211b">
    <rect x="40" y="340" width="360" height="190" rx="12" fill="#f4f6f5" stroke="#b5c2bb" stroke-width="1.5"/>
    <text x="58" y="370" font-size="17" font-weight="700">Respuestas fijas</text>
    <text x="58" y="398">• Saludo y menú de bienvenida</text>
    <text x="58" y="420">• «Le paso con la secretaria» + aviso</text>
    <text x="58" y="442">• Pide hablar con una persona → aviso</text>
    <text x="58" y="464">• Silencio: «gracias», «ok», sticker,</text>
    <text x="72" y="484">o le contesta a la secretaria</text>
    <text x="58" y="506">• Audio que no se pudo escuchar → pide texto</text>

    <rect x="440" y="340" width="260" height="190" rx="12" fill="#e3f1e8" stroke="#16a34a" stroke-width="1.5"/>
    <text x="458" y="370" font-size="17" font-weight="700">Turnos</text>
    <text x="458" y="398">Busca horarios en la agenda</text>
    <text x="458" y="420">Reserva (nuevo: nombre,</text>
    <text x="458" y="440">apellido y DNI)</text>
    <text x="458" y="462">Cambia o cancela (+ de 48 h)</text>
    <text x="458" y="484">Confirma asistencia</text>
    <text x="458" y="508" font-weight="700" fill="#15803d">Siempre pregunta «¿Procedo?»</text>

    <rect x="720" y="340" width="260" height="190" rx="12" fill="#e3f1e8" stroke="#16a34a" stroke-width="1.5"/>
    <text x="738" y="370" font-size="17" font-weight="700">Pagos</text>
    <text x="738" y="398">Recibe comprobantes y</text>
    <text x="738" y="418">avisos de pago</text>
    <text x="738" y="440">Los anota y avisa: la</text>
    <text x="738" y="460">secretaria los verifica</text>
    <text x="738" y="482">Pasa alias, CBU y titular</text>

    <rect x="1000" y="340" width="260" height="190" rx="12" fill="#e3f1e8" stroke="#16a34a" stroke-width="1.5"/>
    <text x="1018" y="370" font-size="17" font-weight="700">Información</text>
    <text x="1018" y="398">Precio de la primera consulta</text>
    <text x="1018" y="420">Horarios y dirección</text>
    <text x="1018" y="442">Tratamientos que se hacen</text>
    <text x="1018" y="464">Obra social y formas de pago</text>
    <text x="1018" y="486">Solo con los datos cargados</text>
    <text x="1018" y="506">en Conocimiento</text>

    <rect x="1280" y="340" width="280" height="190" rx="12" fill="#fdf2f2" stroke="#d9a3a3" stroke-width="1.5"/>
    <text x="1298" y="370" font-size="17" font-weight="700">Urgencias</text>
    <text x="1298" y="398">Si una urgencia no la atajó</text>
    <text x="1298" y="418">el paso 3, la deriva al</text>
    <text x="1298" y="438">triaje y avisa a la Dra.</text>
    <text x="1298" y="462" font-weight="700" fill="#a61b1b">No diagnostica ni da</text>
    <text x="1298" y="482" font-weight="700" fill="#a61b1b">indicaciones</text>
  </g>

  <!-- Datos que usan -->
  <g font-size="14" fill="#16211b">
    <rect x="440" y="570" width="260" height="62" rx="10" fill="#ffffff" stroke="#9fb8aa" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="458" y="596" font-weight="700">Dentalink (la agenda)</text>
    <text x="458" y="618">turnos reales, fichas</text>
    <rect x="1000" y="570" width="260" height="62" rx="10" fill="#ffffff" stroke="#9fb8aa" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="1018" y="596" font-weight="700">Conocimiento (panel)</text>
    <text x="1018" y="618">precios, horarios, datos</text>
  </g>
  <g stroke="#3c4a43" stroke-width="1.5" fill="none" marker-end="url(#flecha)">
    <line x1="570" y1="530" x2="570" y2="566"/>
    <line x1="1130" y1="566" x2="1130" y2="534"/>
  </g>
  <text x="580" y="553" font-size="12" fill="#4b5a52">lee y escribe</text>
  <text x="1140" y="553" font-size="12" fill="#4b5a52">le da los datos</text>

  <!-- FILA 3: salidas -->
  <g font-size="14" fill="#16211b">
    <rect x="40" y="680" width="380" height="110" rx="12" fill="#eef4f0" stroke="#9fb8aa" stroke-width="1.5"/>
    <text x="58" y="710" font-size="17" font-weight="700">Respuesta al paciente</text>
    <text x="58" y="736">Un solo mensaje por WhatsApp, en orden:</text>
    <text x="58" y="756">información → pagos → derivación → turnos.</text>

    <rect x="460" y="680" width="440" height="110" rx="12" fill="#eef3fb" stroke="#9db4dc" stroke-width="1.5"/>
    <text x="478" y="710" font-size="17" font-weight="700">Aviso al grupo «WhatsApp Clínica Raquel»</text>
    <text x="478" y="736">Urgencias, pagos, pedidos de una persona y lo</text>
    <text x="478" y="756">que Asiri no atiende. También queda en el</text>
    <text x="478" y="776">panel, sección Atención.</text>

    <rect x="940" y="680" width="620" height="110" rx="12" fill="#eef3fb" stroke="#9db4dc" stroke-width="1.5"/>
    <text x="958" y="710" font-size="17" font-weight="700">Recordatorios automáticos</text>
    <text x="958" y="736">2 días hábiles antes del turno, a la mañana (lunes a viernes).</text>
    <text x="958" y="756">Si contesta «Confirmo», «sí» o manda el comprobante, Turnos lo</text>
    <text x="958" y="776">confirma solo. Si quiere cambiarlo, le ofrece horarios.</text>
  </g>
  <g stroke="#3c4a43" stroke-width="2" fill="none" marker-end="url(#flecha)">
    <line x1="220" y1="530" x2="220" y2="676"/>
    <line x1="850" y1="530" x2="680" y2="676"/>
  </g>
  <text x="230" y="610" font-size="12" fill="#4b5a52">responde</text>
  <text x="772" y="610" font-size="12" fill="#4b5a52">avisa</text>

  <!-- FILA 4: qué hace, qué no, la secretaria -->
  <g font-size="15" fill="#16211b">
    <rect x="40" y="830" width="490" height="320" rx="14" fill="#f2faf5" stroke="#16a34a" stroke-width="2"/>
    <text x="60" y="866" font-size="19" font-weight="700" fill="#15803d">Lo que Asiri SÍ hace</text>
    <text x="60" y="900">• Saca turnos: busca horarios reales y reserva</text>
    <text x="60" y="928">• A un paciente nuevo le pide nombre, apellido y DNI</text>
    <text x="60" y="956">• Antes de tocar la agenda pregunta «¿Procedo?»</text>
    <text x="60" y="984">• Cambia o cancela turnos con más de 48 h</text>
    <text x="60" y="1012">• Confirma cuando contestan el recordatorio</text>
    <text x="60" y="1040">• Recibe comprobantes y pasa el alias</text>
    <text x="60" y="1068">• Precio de la consulta, horarios, dirección</text>
    <text x="60" y="1096">• Entiende audios y varios pedidos juntos</text>
    <text x="60" y="1124">• Atiende de día y de noche, todos los días</text>

    <rect x="555" y="830" width="490" height="320" rx="14" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
    <text x="575" y="866" font-size="19" font-weight="700" fill="#c2410c">Lo que NO hace (lo pasa a la secretaria)</text>
    <text x="575" y="900">• Diagnósticos, dolores o consultas clínicas</text>
    <text x="575" y="928">• Precios de tratamientos, presupuestos, cuotas</text>
    <text x="575" y="956">• Pagos en dólares, descuentos o excepciones</text>
    <text x="575" y="984">• Cambios o cancelaciones a menos de 48 h</text>
    <text x="575" y="1012">• Confirmar que un pago entró (solo lo anota)</text>
    <text x="575" y="1040">• Quejas, bajas, proveedores, temas personales</text>
    <text x="575" y="1068">• Nunca dice «venga ahora» ni da indicaciones</text>
    <text x="575" y="1096">• Si no sabe algo, no inventa: avisa</text>
    <text x="575" y="1124">• No habla si la secretaria escribió hace &lt; 1 h</text>

    <rect x="1070" y="830" width="490" height="320" rx="14" fill="#eef3fb" stroke="#1d4ed8" stroke-width="2"/>
    <text x="1090" y="866" font-size="19" font-weight="700" fill="#1d4ed8">Lo que hace la secretaria</text>
    <text x="1090" y="900">• Mira el grupo y el panel (Atención) seguido</text>
    <text x="1090" y="928">• Al escribirle a un paciente, Asiri se calla 1 h</text>
    <text x="1090" y="956">• Atención: tomar el caso, contestar, resolver</text>
    <text x="1090" y="984">• Verifica los pagos que Asiri anotó</text>
    <text x="1090" y="1012">• Responde lo que Asiri le derivó</text>
    <text x="1090" y="1040">• Conocimiento: precios, horarios y datos</text>
    <text x="1090" y="1068">• Asiri: saludo, tono y mensajes fijos</text>
    <text x="1090" y="1096">• Si Asiri se equivoca: le escribe ella al</text>
    <text x="1104" y="1124">paciente y avisa a Lucas con captura</text>
  </g>

  <text x="40" y="1176" font-size="12" fill="#6b7a72">Asiri v7 · versión del 31/10/2026 · Turnos y fichas: Dentalink · Mensajes: WhatsApp · Datos y panel: panel de la clínica</text>
</svg>
